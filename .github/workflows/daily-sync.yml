name: Daily Bellhaven website / CRM refresh

on:
  workflow_dispatch:

jobs:
  refresh-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore yesterday's decision store
        uses: actions/cache@v4
        with:
          path: data/decisions.json
          key: decisions-${{ github.run_id }}
          restore-keys: |
            decisions-
      - name: Scrape website (always)
        run: python -m src.pipeline scrape
      - name: Snapshot CRM + match
        env:
          CRM_TOKEN: ${{ secrets.CRM_TOKEN }}
        run: |
          if [ -z "$CRM_TOKEN" ]; then
            echo "No CRM_TOKEN repo secret. Scrape-only; skip snapshot/match."
            echo "Add it at Settings → Secrets and variables → Actions → CRM_TOKEN"
            exit 0
          fi
          python -m src.pipeline run --skip-scrape
      - name: Upload queue artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-queue
          path: |
            data/website_communities.json
            data/proposals.json
            data/decisions.json
          if-no-files-found: warn
      # Intentionally no approve step. CRM writes only happen from the review app.
